<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Klef - SPA Modular Completa</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- =======================================================================
         SPRITE SVG — símbolos inline, sin ningún CDN
         ======================================================================= -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      style="display: none"
      aria-hidden="true"
    >
      <!-- house -->
      <symbol id="icon-house" viewBox="0 0 24 24">
        <path
          d="M3 10.5L12 3l9 7.5V21a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V10.5z"
          class="icon-secondary"
        />
        <path d="M9 22V12h6v10" />
      </symbol>

      <!-- rss -->
      <symbol id="icon-rss" viewBox="0 0 24 24">
        <circle cx="5" cy="19" r="1.8" fill="currentColor" stroke="none" />
        <path d="M4 11c4.97 0 9 4.03 9 9" />
        <path d="M4 4c8.28 0 15 6.72 15 15" class="icon-secondary" />
      </symbol>

      <!-- search / magnifying-glass -->
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" class="icon-secondary" />
        <path d="M16.5 16.5L22 22" />
      </symbol>

      <!-- arrow-left -->
      <symbol id="icon-arrow-left" viewBox="0 0 24 24">
        <path d="M19 12H5" />
        <path d="M12 5l-7 7 7 7" />
      </symbol>

      <!-- x / close -->
      <symbol id="icon-x" viewBox="0 0 24 24">
        <path d="M18 6L6 18M6 6l12 12" />
      </symbol>

      <!-- list / hamburger -->
      <symbol id="icon-list" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </symbol>

      <!-- share-network -->
      <symbol id="icon-share" viewBox="0 0 24 24">
        <circle cx="18" cy="5" r="2.5" class="icon-secondary" />
        <circle cx="6" cy="12" r="2.5" class="icon-secondary" />
        <circle cx="18" cy="19" r="2.5" class="icon-secondary" />
        <path d="M8.4 10.8l7.2-4M8.4 13.2l7.2 4" />
      </symbol>

      <!-- reload / arrows-clockwise -->
      <symbol id="icon-reload" viewBox="0 0 24 24">
        <path d="M21 3v6h-6" />
        <path d="M21 9A9 9 0 1 1 14.36 3.64" class="icon-secondary" />
      </symbol>

      <!-- gear / settings -->
      <symbol id="icon-gear" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" class="icon-secondary" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
        />
      </symbol>

      <!-- user -->
      <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" class="icon-secondary" />
        <path d="M4 20c0-4 3.58-7 8-7s8 3 8 7" />
      </symbol>

      <!-- moon -->
      <symbol id="icon-moon" viewBox="0 0 24 24">
        <path
          d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
          class="icon-secondary"
        />
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </symbol>

      <!-- sun -->
      <symbol id="icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" class="icon-secondary" />
        <path
          d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
        />
      </symbol>
    </svg>

    <!-- ======================================================================= -->

    <div class="scrim" id="scrim"></div>

    <main>
      <div id="app" data-status="loaded">
        <h1
          style="
            font-size: 2.5rem;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
          "
        >
          <!-- Ingeniería Klef -->
        </h1>
        <p
          style="
            color: var(--color-text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
          "
        >
          Interfaz modular con búsqueda expandible y sheet gestual de 3 niveles.
        </p>
        <div
          style="
            background: #1e1e1c;
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
          "
        >
          <h3 style="margin-bottom: 8px">Instrucciones</h3>
          <ul style="padding-left: 20px; color: var(--color-text-muted)">
            <li>
              Toca la <b>Lupa</b> para ver los botones satélites (Flecha/X).
            </li>
            <li>Toca el <b>Menú</b> para abrir el sheet (Small).</li>
            <li>Desliza el <b>Handler</b> hacia arriba para Full.</li>
          </ul>
        </div>
      </div>
    </main>

    <nav
      class="bottom-island"
      id="island"
      data-sheet-state="closed"
      data-search-active="false"
    >
      <!-- Área Gestual -->
      <div data-behavior="handler-area" id="handler-area">
        <div class="handler"></div>
      </div>

      <!-- Navegación Dinámica -->
      <div class="nav-content">
        <!-- Botones Principales -->
        <button class="nav-btn main-nav-btn" aria-label="Inicio">
          <svg class="icon"><use href="#icon-house" /></svg>
        </button>
        <button class="nav-btn main-nav-btn" aria-label="Feed">
          <svg class="icon"><use href="#icon-rss" /></svg>
        </button>

        <!-- Botón Satélite Izquierdo (Cancelar) -->
        <button
          class="nav-btn search-ctrl-btn"
          data-action="cancel-search"
          aria-label="Cancelar"
        >
          <svg class="icon"><use href="#icon-x"></use></svg>
        </button>

        <!-- Barra de Búsqueda -->
        <div class="search-wrapper" id="search-trigger">
          <input
            type="text"
            id="search-input"
            placeholder="Buscar..."
            autocomplete="off"
          />
          <svg class="icon search-icon" aria-hidden="true">
            <use href="#icon-search" />
          </svg>
        </div>

        <!-- Botón Satélite Derecho (Borrar) -->
        <button
          class="nav-btn search-ctrl-btn"
          data-action="clear-search"
          aria-label="Borrar"
        >
          <svg class="icon"><use href="#icon-arrow-left" /></svg>
        </button>

        <!-- Botón Menú -->
        <button
          class="nav-btn main-nav-btn"
          id="menu-trigger"
          aria-label="Menú"
        >
          <svg class="icon"><use href="#icon-list" /></svg>
        </button>
      </div>

      <!-- Cuerpo del Sheet -->
      <div class="sheet-body">
        <div class="menu-grid">
          <div class="menu-item">
            <svg class="icon"><use href="#icon-share" /></svg>
            Compartir
          </div>
          <div class="menu-item">
            <svg class="icon"><use href="#icon-reload" /></svg>
            Recargar
          </div>
          <div class="menu-item">
            <svg class="icon"><use href="#icon-gear" /></svg>
            Ajustes
          </div>
          <div class="menu-item">
            <svg class="icon"><use href="#icon-user" /></svg>
            Perfil
          </div>
          <!-- Toggle Dark / Light -->
          <div class="menu-item toggle-theme" id="theme-toggle">
            <div class="toggle-theme-left">
              <svg class="icon" aria-hidden="true">
                <use id="theme-icon-use" href="#icon-moon" />
              </svg>
              <span id="theme-label">Modo oscuro</span>
            </div>
            <div class="toggle-pill"></div>
          </div>
        </div>
      </div>
    </nav>

    <script>
      const island = document.getElementById("island");
      const menuTrigger = document.getElementById("menu-trigger");
      const searchTrigger = document.getElementById("search-trigger");
      const searchInput = document.getElementById("search-input");
      const handlerArea = document.getElementById("handler-area");
      const scrim = document.getElementById("scrim");

      // --- LÓGICA DE BÚSQUEDA ---

      const setSearchMode = (active) => {
        island.dataset.searchActive = active;
        if (active) {
          island.dataset.sheetState = "closed";
          setTimeout(() => searchInput.focus(), 100);
        } else {
          searchInput.value = "";
          searchInput.blur();
        }
      };

      searchTrigger.addEventListener("click", () => {
        if (island.dataset.searchActive === "false") setSearchMode(true);
      });

      document.addEventListener("click", (e) => {
        const actionBtn = e.target.closest("[data-action]");
        if (!actionBtn) return;

        if (actionBtn.dataset.action === "cancel-search") setSearchMode(false);
        if (actionBtn.dataset.action === "clear-search") {
          searchInput.value = "";
          searchInput.focus();
        }
      });

      // --- LÓGICA DE SHEET (3 ESTADOS) ---

      const toggleSheet = () => {
        setSearchMode(false);
        if (island.dataset.sheetState !== "closed") {
          island.dataset.sheetState = "closed";
        } else {
          island.dataset.sheetState = "small";
        }
      };

      menuTrigger.addEventListener("click", toggleSheet);
      scrim.addEventListener(
        "click",
        () => (island.dataset.sheetState = "closed"),
      );

      // --- GESTOS (SWIPE) ---

      let startY = 0;
      let endY = 0;

      const handleSwipe = () => {
        const diff = startY - endY;
        const state = island.dataset.sheetState;

        if (diff > 50) {
          // Swipe Up
          if (state === "small") island.dataset.sheetState = "full";
        } else if (diff < -50) {
          // Swipe Down
          if (state === "full") island.dataset.sheetState = "small";
          else if (state === "small") island.dataset.sheetState = "closed";
        }
      };

      handlerArea.addEventListener(
        "touchstart",
        (e) => (startY = e.touches[0].clientY),
        { passive: true },
      );
      handlerArea.addEventListener(
        "touchend",
        (e) => {
          endY = e.changedTouches[0].clientY;
          handleSwipe();
        },
        { passive: true },
      );

      // --- TOGGLE TEMA ---
      const themeToggle = document.getElementById("theme-toggle");
      const themeIconUse = document.getElementById("theme-icon-use");
      const themeLabel = document.getElementById("theme-label");
      let isDark = true;

      themeToggle.addEventListener("click", () => {
        isDark = !isDark;
        document.body.classList.toggle("theme-light", !isDark);
        themeIconUse.setAttribute("href", isDark ? "#icon-moon" : "#icon-sun");
        themeLabel.textContent = isDark ? "Modo oscuro" : "Modo claro";
      });

      // Soporte Mouse para pruebas en desktop
      handlerArea.addEventListener("mousedown", (e) => {
        startY = e.clientY;
        const up = (me) => {
          endY = me.clientY;
          handleSwipe();
          document.removeEventListener("mouseup", up);
        };
        document.addEventListener("mouseup", up);
      });
    </script>
  </body>
</html>
